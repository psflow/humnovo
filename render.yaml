# Blueprint do Render: https://render.com/deploy?repo=https://github.com/psflow/humnovo
# As chaves são geradas automaticamente pelo Render no primeiro deploy.
# Em produção, defina HUMNOVO_DEMO=0 e HUMNOVO_HOSTNAMES com os seus domínios.
services:
  - type: web
    name: humnovo
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/server/cli.js
    healthCheckPath: /health
    envVars:
      - key: HUMNOVO_SITE_KEY
        generateValue: true
      - key: HUMNOVO_SECRET_KEY
        generateValue: true
      - key: HUMNOVO_LEVEL
        value: medium
      - key: HUMNOVO_DEMO
        value: "1"
