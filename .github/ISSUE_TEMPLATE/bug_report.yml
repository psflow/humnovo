name: 🐛 Bug report / Relatar bug
description: Something isn't working as expected / Algo não funciona como esperado
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report! / Obrigado por reportar!
        ⚠️ Security issues: please use [private reporting](https://github.com/psflow/humnovo/security/advisories/new). / Vulnerabilidades: use o reporte privado.
  - type: textarea
    id: description
    attributes:
      label: What happened? / O que aconteceu?
      description: A clear description of the bug. / Descrição clara do problema.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Passos para reproduzir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Comportamento esperado
  - type: input
    id: version
    attributes:
      label: Humnovo version / Versão
      placeholder: "0.1.0"
  - type: input
    id: environment
    attributes:
      label: Environment / Ambiente
      placeholder: "Node 22, Chrome 130, Windows 11"
